<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../config.js"></script>

  <title>競爭風險存活分析 (Competing Risks Analysis)</title>

  <link rel="stylesheet" href="../style.css" />

  <style>
    /* 沿用原本的樣式 */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .action-buttons button,
    .action-buttons a {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .block-card {
      background-color: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 40px;
      position: relative;
    }

    .deleteBlock {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: #ffb5a7;
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 18px;
      cursor: pointer;
    }

    /* 基本表格樣式 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.95em;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #eee4e1;
    }

    .upload-row {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .downloadLink {
      background-color: #ff80ab;
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      color: black;
      display: none;
    }

    /* 存活分析專用樣式 */
    .chart-box {
        text-align: center;
        border: 1px solid #eee;
        padding: 10px;
        border-radius: 10px;
        background: #f9f9f9;
        margin-bottom: 20px;
    }

    .chart-box img {
        max-width: 100%;
        height: auto;
        border-radius: 5px;
    }

    .report-box {
        background: #f4f4f4;
        padding: 15px;
        border-radius: 10px;
        border-left: 5px solid #ff80ab;
        max-height: 300px;
        overflow-y: auto;
        margin-top: 20px;
    }

    .report-text {
        white-space: pre-wrap; 
        font-family: monospace;
        color: #444;
        font-size: 0.9em;
    }

    .input-label {
        font-size: 0.9em;
        color: #555;
        font-weight: bold;
    }

    .custom-input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        width: 150px;
    }
    
    .note-text {
        font-size: 0.8em;
        color: #888;
        margin-left: 10px;
    }

    /* === 新增排版樣式 (與 Recurrent Events 一致) === */
    .result-sections-container {
        display: flex;
        flex-wrap: wrap; 
        gap: 20px;       
        align-items: flex-start;
    }

    .table-wrapper {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        flex: 1 1 300px; 
        min-width: 300px;
    }

    .table-wrapper.full-width {
        flex: 1 1 100%;
    }

    .table-wrapper h4 {
        margin-top: 0;
        margin-bottom: 10px;
        color: #333;
        border-bottom: 2px solid #ffe4e1;
        padding-bottom: 5px;
    }

    .table-wrapper h5 {
        margin: 15px 0 5px 0;
        color: #666;
        font-size: 0.9em;
    }
  </style>
</head>

<body class="stat-competing"> 
  <div class="container">
    <div class="title">Competing Risks Analysis</div>
    <div class="subtitle" style="text-align: center; color: #666; margin-top: -30px; margin-bottom: 30px;">Cumulative Incidence Function (CIF) & Cause-Specific Cox</div>
    
    <div class="action-buttons">
      <button id="addBlock" class="sidebar-button-style btn-6">＋ 新增檢定</button>
      <button id="runAll" class="sidebar-button-style btn-7">▶ 一鍵執行全部</button>
      <a href="../sample/mgus2_data.xlsx"
         download
         class="sidebar-button-style btn-8">
        下載範例資料
      </a>
      <button id="downloadZip" class="sidebar-button-style btn-9">下載全部結果（ZIP）</button>
    </div>

    <div id="blocksContainer"></div>
    
    <div class="back-button-container">
      <a href="../statisticList.html" class="back-button btn-1">back</a>
    </div>
  </div>

  <template id="blockTemplate">
    <div class="block-card">
      <button class="deleteBlock">✕</button>

      <div class="upload-row">
        <input type="file" class="fileInput" accept=".xlsx, .xls, .csv" required />
        <a class="downloadLink" target="_blank">下載結果 (ZIP)</a>
      </div>

      <div class="upload-row">
        <span class="input-label">分組欄位 (Group Column)：</span>
        <input type="text" class="groupInput" placeholder="例如: TREAT" class="custom-input" />
        <span class="note-text">*若不填寫則分析整體族群</span>
      </div>

      <div class="analysis-result" style="display: none;">
        <div class="chart-box">
            <h4>Cumulative Incidence Function (CIF)</h4>
            <img class="resultImage" src="" alt="CIF Plot" />
        </div>

        <div class="result-sections-container"></div>

        <div class="report-box">
            <h4>Analysis Log</h4>
            <pre class="report-text"></pre>
        </div>
      </div>
      
      <div class="status-msg" style="color:#999; margin-top:20px; text-align:center;">尚無結果</div>
    </div>
  </template>

  <script>
    const blocksContainer = document.getElementById("blocksContainer");
    const blockTemplate = document.getElementById("blockTemplate");
    const { BASE_URL } = window.API_CONFIG; 

    const COMPETING_ENDPOINT = "/survival/competing_risk/upload"; 
    const DOWNLOAD_SINGLE = "/survival/download"; 
    const IMAGE_URL = "/survival/image";               

    let blocks = [];

    // 輔助函式：建立表格 DOM
    function createTableDOM(columns, data) {
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");

        if (columns) {
            const tr = document.createElement("tr");
            columns.forEach(col => {
                const th = document.createElement("th");
                th.textContent = col;
                tr.appendChild(th);
            });
            thead.appendChild(tr);
        }

        if (data) {
            data.forEach(row => {
                const tr = document.createElement("tr");
                columns.forEach(col => {
                    const td = document.createElement("td");
                    let val = row[col];
                    if (typeof val === 'number') {
                         // P-value 特殊處理
                         if (col.toLowerCase().includes('p') && val < 0.001) {
                            val = "< 0.001"; // 或 val.toFixed(4)
                         } else {
                            val = val.toFixed(3);
                         }
                    }
                    td.textContent = (val === null || val === undefined) ? "" : val;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }
        table.appendChild(thead);
        table.appendChild(tbody);
        return table;
    }

    function addBlock() {
      const clone = blockTemplate.content.cloneNode(true);
      const blockEl = clone.querySelector(".block-card");

      const fileInput = blockEl.querySelector(".fileInput");
      const groupInput = blockEl.querySelector(".groupInput");
      const downloadLink = blockEl.querySelector(".downloadLink");
      const deleteBtn = blockEl.querySelector(".deleteBlock");
      
      const analysisResult = blockEl.querySelector(".analysis-result");
      const resultImage = blockEl.querySelector(".resultImage");
      
      // 改為選取 sections container
      const sectionsContainer = blockEl.querySelector(".result-sections-container");
      
      const reportText = blockEl.querySelector(".report-text");
      const statusMsg = blockEl.querySelector(".status-msg");

      deleteBtn.addEventListener("click", () => {
        blockEl.remove();
        blocks = blocks.filter(b => b.block !== blockEl);
      });

      blocks.push({ 
          block: blockEl, 
          fileInput, 
          groupInput,
          downloadLink, 
          analysisResult,
          resultImage, 
          sectionsContainer, // 儲存這個引用
          reportText, 
          statusMsg,
          task_id: null 
      });
      
      blocksContainer.appendChild(blockEl);
    }

    async function runAll() {
      for (const item of blocks) {
        const file = item.fileInput.files[0];
        const groupCol = item.groupInput.value.trim();

        // 重置 UI
        item.analysisResult.style.display = "none";
        item.sectionsContainer.innerHTML = ""; // 清空內容
        item.reportText.textContent = "";
        item.resultImage.src = "";
        item.downloadLink.style.display = "none";

        if (!file) {
          item.statusMsg.textContent = "尚未上傳檔案";
          item.statusMsg.style.display = "block";
          continue;
        }

        item.statusMsg.textContent = "正在執行競爭風險分析 (CIF & Cox)...";
        item.statusMsg.style.display = "block";

        const formData = new FormData();
        formData.append("file", file);
        if (groupCol) formData.append("group_col", groupCol);

        try {
            const res = await fetch(`${BASE_URL}${COMPETING_ENDPOINT}`, {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "分析失敗");

            item.task_id = data.task_id;

            // 1. 設定圖片
            item.resultImage.src = `${BASE_URL}${IMAGE_URL}/${data.task_id}?t=${new Date().getTime()}`;

            // 2. 設定報告
            item.reportText.textContent = data.report_text || "分析完成。";

            // 3. 渲染結果表格 (與 Recurrent Events 邏輯一致)
            if (data.sections && Array.isArray(data.sections)) {
                data.sections.forEach(section => {
                    const wrapper = document.createElement("div");
                    wrapper.className = "table-wrapper";
                    
                    // 判斷 Layout
                    if (section.layout === 'full') {
                        wrapper.classList.add("full-width");
                    } else if (!section.layout && section.columns && section.columns.length > 5) {
                        wrapper.classList.add("full-width");
                    }

                    // 標題
                    const title = document.createElement("h4");
                    title.textContent = section.title;
                    wrapper.appendChild(title);

                    // 內容：檢查是否為多個表格 (Stack)
                    if (section.tables && Array.isArray(section.tables)) {
                        section.tables.forEach((tbl, index) => {
                            if (tbl.sub_title) {
                                const subH = document.createElement("h5");
                                subH.textContent = tbl.sub_title;
                                wrapper.appendChild(subH);
                            } else if (index > 0) {
                                const spacer = document.createElement("div");
                                spacer.style.height = "20px";
                                wrapper.appendChild(spacer);
                            }
                            wrapper.appendChild(createTableDOM(tbl.columns, tbl.data));
                        });
                    } else {
                        // 單一表格
                        wrapper.appendChild(createTableDOM(section.columns, section.data));
                    }

                    item.sectionsContainer.appendChild(wrapper);
                });
            }

            item.statusMsg.style.display = "none";
            item.analysisResult.style.display = "block";
            item.downloadLink.style.display = "inline-block";
            item.downloadLink.href = `${BASE_URL}${DOWNLOAD_SINGLE}/${item.task_id}`;

        } catch (err) {
            item.statusMsg.style.color = "red";
            item.statusMsg.textContent = err.message;
        }
      }
    }

    document.getElementById("addBlock").addEventListener("click", addBlock);
    document.getElementById("runAll").addEventListener("click", runAll);
    
    addBlock();
  </script>
</body>
</html>
