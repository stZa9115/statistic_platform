<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../config.js"></script>

  <title>重復事件存活分析 (Recurrent Event Analysis)</title>

  <link rel="stylesheet" href="../style.css" />

  <style>
    /* 沿用原本的樣式 */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .action-buttons button,
    .action-buttons a {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .block-card {
      background-color: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 40px;
      position: relative;
    }

    .deleteBlock {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: #ffb5a7;
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 18px;
      cursor: pointer;
    }

    /* 表格樣式 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.95em;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #eee4e1;
    }

    .section-title {
      background-color: #ffe4e1;
      font-weight: bold;
      text-align: left;
      padding-left: 15px;
      color: #333;
    }

    .upload-row {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .downloadLink {
      background-color: #ff80ab;
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      color: black;
      display: none;
    }

    /* 存活分析專用樣式 */
    .analysis-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 20px;
    }

    .chart-box {
        text-align: center;
        border: 1px solid #eee;
        padding: 10px;
        border-radius: 10px;
        background: #f9f9f9;
    }

    .chart-box img {
        max-width: 100%;
        height: auto;
        border-radius: 5px;
    }

    .report-box {
        background: #f4f4f4;
        padding: 15px;
        border-radius: 10px;
        border-left: 5px solid #ff80ab;
        max-height: 300px;
        overflow-y: auto;
        margin-top: 20px;
    }

    .report-text {
        white-space: pre-wrap; 
        font-family: monospace;
        color: #444;
        font-size: 0.9em;
    }

    .input-label {
        font-size: 0.9em;
        color: #555;
        font-weight: bold;
    }

    .custom-input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        width: 150px;
    }
    /* 新增：結果容器，使用 Flexbox 讓子元素並排 */
    .result-sections-container {
        display: flex;
        flex-wrap: wrap; /* 空間不足時自動換行 */
        gap: 20px;       /* 表格之間的間距 */
        align-items: flex-start; /* 對齊頂部 */
        margin-top: 20px;
    }

    /* 每個表格的外層包裝 */
    .table-wrapper {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        flex: 1 1 300px; /* 彈性寬度：基礎 300px，可伸展 */
        min-width: 300px; /* 防止縮太小 */
    }

    /* 讓係數表 (Coefficients) 這種大表格強制佔滿整行 */
    .table-wrapper.full-width {
        flex: 1 1 100%;
    }

    /* 調整表格標題樣式 */
    .table-wrapper h4 {
        margin-top: 0;
        margin-bottom: 10px;
        color: #333;
        border-bottom: 2px solid #ffe4e1;
        padding-bottom: 5px;
    }
  </style>
</head>

<body class="stat-recurrent"> 
  <div class="container">
    <div class="title">Recurrent Event Analysis</div>
    <div class="subtitle" style="text-align: center; color: #666; margin-top: -30px; margin-bottom: 30px;">Andersen-Gill Model & Nelson-Aalen Plot</div>
    
    <div class="action-buttons">
      <button id="addBlock" class="sidebar-button-style btn-6">＋ 新增檢定</button>
      <button id="runAll" class="sidebar-button-style btn-7">▶ 一鍵執行全部</button>
      <a href="../sample/recurrent_event_data.csv"
         download
         class="sidebar-button-style btn-8">
        下載範例資料
      </a>
      <button id="downloadZip" class="sidebar-button-style btn-9">下載全部結果（ZIP）</button>
    </div>

    <div id="blocksContainer"></div>
    
    <div class="back-button-container">
      <a href="../statisticList.html" class="back-button btn-1">back</a>
    </div>
  </div>

  <template id="blockTemplate">
    <div class="block-card">
      <button class="deleteBlock">✕</button>

      <div class="upload-row">
        <input type="file" class="fileInput" accept=".xlsx, .xls, .csv" required />
        <a class="downloadLink" target="_blank">下載結果 (ZIP)</a>
      </div>

      <div class="upload-row">
        <span class="input-label">分組欄位：</span>
        <input type="text" class="groupInput" placeholder="例如: TREAT" class="custom-input" />
        <span class="input-label" style="margin-left:10px;">共變量 (用逗號隔開)：</span>
        <input type="text" class="covarInput" placeholder="例如: TREAT, AGE" class="custom-input" style="width:200px;" />
      </div>

      <div class="analysis-result" style="display: none;">
    <div class="chart-box">
        <h4>Nelson-Aalen Cumulative Hazard Curve</h4>
        <img class="resultImage" src="" alt="Recurrent Event Plot" />
    </div>

    <div class="result-sections-container"></div> 

    <div class="report-box">
        <h4>Analysis Log / Assumptions</h4>
        <pre class="report-text"></pre>
    </div>
</div>>
      
      <div class="status-msg" style="color:#999; margin-top:20px; text-align:center;">尚無結果</div>
    </div>
  </template>

  <script>
    const blocksContainer = document.getElementById("blocksContainer");
    const blockTemplate = document.getElementById("blockTemplate");
    const { BASE_URL } = window.API_CONFIG; 

    // 指向您在後端註冊的 RecurrentSurvivalAnalysis.name
    const RECURRENT_ENDPOINT = "/survival/recurrent_survival/upload"; 
    const DOWNLOAD_SINGLE = "/survival/download"; 
    const IMAGE_URL = "/survival/image";               

    let blocks = [];

    function addBlock() {
      const clone = blockTemplate.content.cloneNode(true);
      const blockEl = clone.querySelector(".block-card");

      const fileInput = blockEl.querySelector(".fileInput");
      const groupInput = blockEl.querySelector(".groupInput");
      const covarInput = blockEl.querySelector(".covarInput");
      const downloadLink = blockEl.querySelector(".downloadLink");
      const deleteBtn = blockEl.querySelector(".deleteBlock");
      
      const analysisResult = blockEl.querySelector(".analysis-result");
      const resultImage = blockEl.querySelector(".resultImage");
      // const resultTable = blockEl.querySelector(".resultTable");
      const sectionsContainer = blockEl.querySelector(".result-sections-container"); // <-- 新增這行
      const reportText = blockEl.querySelector(".report-text");
      const statusMsg = blockEl.querySelector(".status-msg");

      deleteBtn.addEventListener("click", () => {
        blockEl.remove();
        blocks = blocks.filter(b => b.block !== blockEl);
      });

      blocks.push({ 
          block: blockEl, 
          fileInput, 
          groupInput,
          covarInput,
          downloadLink, 
          analysisResult,
          resultImage, 
          sectionsContainer, 
          reportText, 
          statusMsg,
          task_id: null 
      });
      
      blocksContainer.appendChild(blockEl);
    }
    function createTableDOM(columns, data) {
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");

        // 表頭
        if (columns) {
            const tr = document.createElement("tr");
            columns.forEach(col => {
                const th = document.createElement("th");
                th.textContent = col;
                tr.appendChild(th);
            });
            thead.appendChild(tr);
        }

        // 內容
        if (data) {
            data.forEach(row => {
                const tr = document.createElement("tr");
                columns.forEach(col => {
                    const td = document.createElement("td");
                    let val = row[col];
                    if (typeof val === 'number') val = val.toFixed(3);
                    td.textContent = (val === null || val === undefined) ? "" : val;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }
        table.appendChild(thead);
        table.appendChild(tbody);
        return table;
    }
    async function runAll() {
      for (const item of blocks) {
        const file = item.fileInput.files[0];
        const groupCol = item.groupInput.value.trim();
        const covariates = item.covarInput.value.trim();

        // 重置 UI
        item.analysisResult.style.display = "none";
        // item.resultTable.innerHTML = "";
        item.sectionsContainer.innerHTML = ""; // 清空容器
        item.reportText.textContent = "";
        item.resultImage.src = "";
        item.downloadLink.style.display = "none";

        if (!file) {
          item.statusMsg.textContent = "尚未上傳檔案";
          item.statusMsg.style.display = "block";
          continue;
        }

        item.statusMsg.textContent = "正在執行 Andersen-Gill 模型分析...";
        item.statusMsg.style.display = "block";

        const formData = new FormData();
        formData.append("file", file);
        if (groupCol) formData.append("group_col", groupCol);
        // 如果後端有處理 covariates 參數，可以加入：
        // if (covariates) formData.append("covariates", covariates);

        try {
            const res = await fetch(`${BASE_URL}${RECURRENT_ENDPOINT}`, {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "分析失敗");

            item.task_id = data.task_id;

            // 1. 設定累積風險圖 (Nelson-Aalen)
            item.resultImage.src = `${BASE_URL}${IMAGE_URL}/${data.task_id}?t=${new Date().getTime()}`;

            // 2. 設定日誌/報告
            if (data.report_text || data.sections) {
                item.reportText.textContent = data.report_text || "分析完成";
            }

            // 3. 渲染多個結果表格 (Coefficients, Model Stats, Study Info)
            // 3. 渲染結果表格 (修改後的邏輯)
            if (data.sections && Array.isArray(data.sections)) {
                data.sections.forEach(section => {
                    // 1. 建立外層 Wrapper
                    const wrapper = document.createElement("div");
                    wrapper.className = "table-wrapper";
                    
                    // 判斷 Layout 是否全寬
                    if (section.layout === 'full') {
                        wrapper.classList.add("full-width");
                    } else if (!section.layout && section.columns && section.columns.length > 5) {
                        wrapper.classList.add("full-width");
                    }

                    // 2. 建立主標題
                    const title = document.createElement("h4");
                    title.textContent = section.title;
                    wrapper.appendChild(title);

                    // 3. 判斷是單一表格還是多表格 (Stacked)
                    if (section.tables && Array.isArray(section.tables)) {
                        // === 新增邏輯：處理堆疊表格 ===
                        section.tables.forEach((tbl, index) => {
                            // 如果有子標題 (Part 1, Part 2)，可以顯示，或僅用 margin 分隔
                            if (tbl.sub_title) {
                                // const subH = document.createElement("h5");
                                // // subH.textContent = tbl.sub_title;
                                // subH.textContent = ""; // 只用 margin 分隔
                                // subH.style.margin = "15px 0 5px 0";
                                // subH.style.color = "#666";
                                // wrapper.appendChild(subH);
                                // 如果沒有標題，但不是第一張表，加一點間距
                                const spacer = document.createElement("div");
                                spacer.style.height = "20px";
                                wrapper.appendChild(spacer);
                            } else if (index > 0) {
                                // 如果沒有標題，但不是第一張表，加一點間距
                                const spacer = document.createElement("div");
                                spacer.style.height = "20px";
                                wrapper.appendChild(spacer);
                            }
                            
                            const table = createTableDOM(tbl.columns, tbl.data);
                            wrapper.appendChild(table);
                        });
                    } else {
                        // === 原有邏輯：單一表格 ===
                        const table = createTableDOM(section.columns, section.data);
                        wrapper.appendChild(table);
                    }

                    // 4. 將做好的整塊表格加到容器中
                    item.sectionsContainer.appendChild(wrapper);
                });
            }
            item.statusMsg.style.display = "none";
            item.analysisResult.style.display = "block";
            item.downloadLink.style.display = "inline-block";
            item.downloadLink.href = `${BASE_URL}${DOWNLOAD_SINGLE}/${item.task_id}`;

        } catch (err) {
            item.statusMsg.style.color = "red";
            item.statusMsg.textContent = err.message;
        }
      }
    }

    document.getElementById("addBlock").addEventListener("click", addBlock);
    document.getElementById("runAll").addEventListener("click", runAll);
    
    // 初始化第一個區塊
    addBlock();
  </script>
</body>
</html>
