<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../config.js"></script>

  <title>重複測量變異數分析</title>

  <link rel="stylesheet" href="../style.css" />

  <style>
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .action-buttons button,
    .action-buttons a {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .block-card {
      background-color: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 40px;
      position: relative;
    }

    .deleteBlock {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: #ffb5a7;
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 18px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.95em;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #eee4e1; /* 預設表頭背景 */
    }

    /* 針對 Section 標題行的樣式 */
    .section-title {
      background-color: #ffe4e1; /* 淺粉色區隔 */
      font-weight: bold;
      text-align: left;
      padding-left: 15px;
      color: #333;
    }

    .upload-row {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .downloadLink {
      background-color: #ff80ab; /* 對應 repeated anova 的 accent */
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      color: black;
      display: none;
    }
  </style>
</head>

<body class="stat-repeated_anova">
  <div class="container">

    <div class="title">Repeated ANOVA</div>

    <div class="action-buttons">
      <button id="addBlock" class="sidebar-button-style btn-6">＋ 新增檢定</button>
      <button id="runAll" class="sidebar-button-style btn-7">▶ 一鍵執行全部</button>

      <a href="../sample/repeated_anova_example.xlsx"
         download
         class="sidebar-button-style btn-8">
        下載範例資料
      </a>

      <button id="downloadZip" class="sidebar-button-style btn-9">
        下載全部結果（ZIP）
      </button>
    </div>

    <div id="blocksContainer"></div>

    <div class="back-button-container">
      <a href="../statisticList.html" class="back-button btn-1">back</a>
    </div>

  </div>

  <template id="blockTemplate">
    <div class="block-card">
      <button class="deleteBlock">✕</button>

      <div class="upload-row">
        <input type="file" class="fileInput" required />
        <a class="downloadLink">下載結果</a>
      </div>

      <table>
        <tbody class="resultTable">
          <tr>
            <td colspan="10" style="color:#999;">尚無結果</td>
          </tr>
        </tbody>
      </table>
    </div>
  </template>

  <script>
    const blocksContainer = document.getElementById("blocksContainer");
    const blockTemplate = document.getElementById("blockTemplate");
    const { BASE_URL, ENDPOINTS } = window.API_CONFIG;

    let blocks = [];

    function addBlock() {
      const clone = blockTemplate.content.cloneNode(true);
      const block = clone.querySelector(".block-card");

      const fileInput = block.querySelector(".fileInput");
      const resultTable = block.querySelector(".resultTable"); // 這裡指向 tbody
      const downloadLink = block.querySelector(".downloadLink");
      const deleteBtn = block.querySelector(".deleteBlock");

      deleteBtn.addEventListener("click", () => {
        block.remove();
        blocks = blocks.filter(b => b.block !== block);
      });

      blocks.push({ block, fileInput, resultTable, downloadLink, task_id: null });
      blocksContainer.appendChild(block);
    }

    async function runAll() {
      for (const block of blocks) {
        const file = block.fileInput.files[0];
        
        // 清空表格
        block.resultTable.innerHTML = "";

        if (!file) {
          block.resultTable.innerHTML = 
            `<tr><td colspan="10" style="color:#999;">尚未上傳檔案</td></tr>`;
          continue;
        }

        const formData = new FormData();
        formData.append("file", file);
        console.log(`${BASE_URL}${ENDPOINTS.repeatedAnova}`);
        // 使用 Repeated ANOVA 的端點
        const res = await fetch(`${BASE_URL}${ENDPOINTS.repeatedAnova}`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        
        // 錯誤處理
        if (data.error) {
          block.resultTable.innerHTML =
            `<tr><td colspan="10" style="color:red;">${data.error}</td></tr>`;
          continue;
        }

        block.task_id = data.task_id;

        // === 資料渲染邏輯 (參考 anova.html 的 section 結構) ===
        if (data.sections && Array.isArray(data.sections)) {
          data.sections.forEach(section => {
            
            // 1. 建立 Section 標題列
            const titleRow = document.createElement("tr");
            const titleCell = document.createElement("td");
            // 計算 colspan，若無 columns 則預設為 5，避免跑版
            const colCount = section.columns ? section.columns.length : 5;
            
            titleCell.colSpan = colCount;
            titleCell.textContent = section.title;
            titleCell.className = "section-title"; // 使用上面定義的 CSS class
            titleRow.appendChild(titleCell);
            block.resultTable.appendChild(titleRow);

            // 2. 建立欄位標題 (Headers)
            if (section.columns && section.columns.length > 0) {
              const headerRow = document.createElement("tr");
              section.columns.forEach(col => {
                const th = document.createElement("th");
                th.textContent = col;
                headerRow.appendChild(th);
              });
              block.resultTable.appendChild(headerRow);
            }

            // 3. 建立數據列 (Data Rows)
            if (section.data && section.data.length > 0) {
              section.data.forEach(row => {
                const tr = document.createElement("tr");
                section.columns.forEach(col => {
                  const td = document.createElement("td");
                  // 根據 key 取值
                  td.textContent = row[col] !== undefined ? row[col] : "";
                  tr.appendChild(td);
                });
                block.resultTable.appendChild(tr);
              });
            }
          });
        } else {
            // 若回傳格式不如預期
            block.resultTable.innerHTML = 
                `<tr><td colspan="10" style="color:red;">回傳資料格式錯誤，無 sections 欄位</td></tr>`;
        }

        // 顯示下載按鈕
        block.downloadLink.style.display = "inline-block";
        block.downloadLink.href = `${BASE_URL}${ENDPOINTS.download}${block.task_id}`;
      }
    }

    document.getElementById("addBlock").addEventListener("click", addBlock);
    document.getElementById("runAll").addEventListener("click", runAll);

    document.getElementById("downloadZip").addEventListener("click", async () => {
      const taskIds = blocks.map(b => b.task_id).filter(Boolean);
      if (taskIds.length === 0) return alert("尚無可下載結果");

      const res = await fetch(`${BASE_URL}${ENDPOINTS.downloadZip}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(taskIds)
      });

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Repeated_ANOVA_Results.zip";
      a.click();
      URL.revokeObjectURL(url);
    });

    addBlock();
  </script>
</body>
